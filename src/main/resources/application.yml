spring:
  application:
    name: banking-platform
  datasource:
    url: jdbc:h2:mem:banking_db
    driver-class-name: org.h2.Driver
    username: admin_viewer
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always





